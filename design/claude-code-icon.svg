<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- Background -->
  <rect width="256" height="256" rx="48" ry="48" fill="#1a1a2e"/>

  <!-- Outer glow ring -->
  <circle cx="128" cy="128" r="96" fill="none" stroke="#d97706" stroke-width="3" opacity="0.4"/>

  <!-- Claude "C" shape - stylized arc -->
  <path d="M 176 90
             A 62 62 0 1 0 176 166"
        fill="none"
        stroke="#d97706"
        stroke-width="14"
        stroke-linecap="round"/>

  <!-- Terminal cursor / code symbol -->
  <rect x="108" y="120" width="14" height="18" rx="2" fill="#d97706" opacity="0.9"/>

  <!-- Prompt chevron ">" -->
  <polyline points="76,112 92,128 76,144"
            fill="none"
            stroke="#f59e0b"
            stroke-width="7"
            stroke-linecap="round"
            stroke-linejoin="round"/>

  <!-- Bottom label -->
  <text x="128" y="218"
        font-family="'SF Mono', 'Courier New', monospace"
        font-size="18"
        font-weight="700"
        fill="#d97706"
        text-anchor="middle"
        letter-spacing="3">CLAUDE</text>
</svg>
